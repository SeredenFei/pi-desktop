# electron-builder 配置（桌面版专用，网页版/npm 包不受影响）
appId: com.xingshuyin.pi-web-ui-desktop
productName: PI
directories:
  output: release
files:
  - bin
  - dist/desktop
  - dist/server
  - web/dist
  - themes
  - plugin-sdk
  - plugins/catalog.json
  - docs/architecture-plugins.md
  - package.json
# 仓库 package.json 的 main 是 CLI（bin/pi-web-ui.mjs，供插件安装器等子进程调用）：
# 桌面壳主进程入口必须是 dist/desktop/main.js，故通过 extraMetadata 覆写 main。
extraMetadata:
  main: dist/desktop/main.js
# asar:false：server 以 ELECTRON_RUN_AS_NODE 跑在纯 Node 语义下，
# 且 node-pty 的 .node 原生模块本来就进不了 asar，直接关闭最省心。
asar: false
# 关掉 electron-builder 的 @electron/rebuild：node-pty 1.1.0 基于 N-API（跨 Node/Electron ABI 通用，
# 无需按 Electron ABI 重编）。注意：node-pty 仅内置 darwin-* / win32-* 的 prebuilds/，Linux 无预编译包，
# pty.node 会在 `npm ci` 时链接构建机 glibc 现编 —— 通过下方三段生命周期钩子自动保证：
#   1) beforePack：若宿主现编原生模块超过 GLIBC 2.35 / GLIBCXX 3.4.30（如 Ubuntu 26.04 runner），
#      自动在 ubuntu:22.04 容器内重编 node-pty / ssh2 / cpu-features；
#   2) afterPack：静态扫描 linux-unpacked 全部 .node 符号上限；
#   3) afterAllArtifactBuild：在 ubuntu:22.04 容器（Xvfb）中冷启动最终 .AppImage 并实测 node-pty 终端读写。
npmRebuild: false
beforePack: ./scripts/electron-builder-hooks.mjs
afterPack: ./scripts/electron-builder-hooks.mjs
afterAllArtifactBuild: ./scripts/electron-builder-hooks.mjs
# 图标：直接复用网页版的 PWA 图标（1024×1024 PNG，electron-builder 自己转 .ico/.icns）。
# 不放进 files：图标是打包时烘进 exe/App 里的，运行时不需要这个文件。
# 更新 feed（issue #180）：显式声明 github publish，`app-update.yml` 不再是
# GH_TOKEN 下的意外产物 —— electron-updater 靠它定位 releases 里的
# latest*.yml。CI 保持 `--publish never`（产物由 gh release upload 手动挂载，
# 避免 electron-builder 直推与 release-notes.yml 打架），feed 文件照常生成。
publish:
  provider: github
  owner: SeredenFei
  repo: pi-desktop
win:
  target:
    - nsis
    - dir
  icon: web/public/icons/icon-1024.png
mac:
  # dmg 给人手装，zip 给 electron-updater 原地更新（Squirrel.Mac 只吃 zip，
  # issue #180A：以前只有 dmg，latest-mac.yml 即使接上 updater 也生效不了）。
  # identity: "-" 强制对整个 .app（含 asar:false 下的 node-pty 原生 .node 与 spawn-helper）
  # 执行统一 ad-hoc 签名，避免内部二进制与主包签名不一致导致 macOS Gatekeeper 报「已损坏」。
  identity: "-"
  target:
    - dmg
    - zip
  icon: web/public/icons/icon-1024.png
linux:
  target: AppImage
  icon: web/public/icons/icon-1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 去空格（issue #180B）：默认产物名 `${productName} Setup ${version}.exe`
  # 带空格，GitHub 把 asset 名里的空格转成点，feed 里的 url 随即 404。
  # 显式无空格名让 latest.yml 与实际 asset 名天然一致。
  artifactName: ${productName}-${version}-setup.${ext}
# 签名：不写死任何证书路径——electron-builder 认 CSC_LINK + CSC_KEY_PASSWORD 环境变量，
# 有证书时自动签（含 mac 的 .p12），没有就出未签名包（Windows SmartScreen 会提示未知发布者）。
# 详见 desktop/README.md「签名」。
